<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>4 Concepts Infographics</title>
<style>
.circle-container {
    position: relative;
    width: 600px;
    height: 600px;
    margin: auto;
    border-radius: 50%;
    overflow: hidden;
}

.slice {
    position: absolute;
    width: 50%;
    height: 50%;
    background-size: cover;
    background-position: center;
    cursor: pointer;
    transition: 0.3s ease;
}

/* Position of slices */
.slice1 { top: 0; left: 0; background-image: url('assets\img\infographic\1.png'); }
.slice2 { top: 0; right: 0; background-image: url('assets\img\infographic\2.png'); }
.slice3 { bottom: 0; right: 0; background-image: url('assets\img\infographic\3.png'); }
.slice4 { bottom: 0; left: 0; background-image: url('assets\img\infographic\4.png'); }

/* Hover effect */
.slice:hover {
    filter: brightness(0.75);
}

/* Hover Text Box */
.hover-text {
    position: absolute;
    width: 220px;
    padding: 14px 18px;
    background: #ffffffee;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    display: none;
    pointer-events: none;
    color: #000;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    z-index: 10;
}
</style>

<div class="circle-container">
    <div class="slice slice1" data-text="Top Left information goes here"></div>
    <div class="slice slice2" data-text="Top Right details appear here"></div>
    <div class="slice slice3" data-text="Bottom Right description here"></div>
    <div class="slice slice4" data-text="Bottom Left points here"></div>

    <div class="hover-text" id="hoverText"></div>
</div>

<script>
const slices = document.querySelectorAll(".slice");
const hoverBox = document.getElementById("hoverText");

slices.forEach(slice => {
    slice.addEventListener("mouseenter", function () {
        const text = this.dataset.text;

        hoverBox.innerHTML = text;
        hoverBox.style.display = "block";

        hoverBox.style.top = "auto";
        hoverBox.style.bottom = "auto";
        hoverBox.style.left = "auto";
        hoverBox.style.right = "auto";

        if (this.classList.contains("slice1")) {
            hoverBox.style.top = "40px";
            hoverBox.style.left = "40px";
        } 
        else if (this.classList.contains("slice2")) {
            hoverBox.style.top = "40px";
            hoverBox.style.right = "40px";
        } 
        else if (this.classList.contains("slice3")) {
            hoverBox.style.bottom = "40px";
            hoverBox.style.right = "40px";
        } 
        else if (this.classList.contains("slice4")) {
            hoverBox.style.bottom = "40px";
            hoverBox.style.left = "40px";
        }
    });

    slice.addEventListener("mouseleave", function () {
        hoverBox.style.display = "none";
    });
});
</script>


</body>
</html>
