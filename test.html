<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>4 Concepts Infographics</title>
<style>
body{
  font-family: Arial, sans-serif;
  background:#f3f4f6;
}

h2{
  text-align:center;
  margin:30px 0;
}

.container{
  width:540px;
  margin:auto;
  position:relative;
}

/* TEXT POSITIONS */
.info-text{
  position:absolute;
  width:160px;
  font-size:16px;
  color:#101840;
  opacity:0;
  transition:.3s;
  text-align:center;
  pointer-events:none;
  line-height:1.3;
}

/* TOP-LEFT */
#topleft{
  top:-20px;
  left:-40px;
}

/* TOP-RIGHT */
#topright{
  top:-20px;
  right:-40px;
}

/* BOTTOM-LEFT */
#bottomleft{
  bottom:-20px;
  left:-40px;
}

/* BOTTOM-RIGHT */
#bottomright{
  bottom:-20px;
  right:-40px;
}

/* IMAGE SLICE STYLE */
.slice{
  cursor:pointer;
  transition:.3s;
}

.slice:hover{
  transform:scale(1.05);
}

</style>
</head>

<body>

<h2>4 Concepts Infographics</h2>

<div class="container">

  <!-- INFO TEXT AROUND CIRCLE -->
  <div id="topleft" class="info-text">Mercury is closest to the Sun</div>
  <div id="topright" class="info-text">Jupiter is the biggest planet</div>
  <div id="bottomleft" class="info-text">Venus is extremely hot</div>
  <div id="bottomright" class="info-text">Mars is cold despite being red</div>

  <!-- MAIN CIRCLE SVG -->
  <svg width="360" height="360" viewBox="0 0 360 360" style="display:block;margin:auto">

    <!-- TOP-RIGHT → Jupiter -->
    <g class="slice" data-target="topright">
      <defs>
        <clipPath id="clip1">
          <path d="M180 180 L180 20 A160 160 0 0 1 340 180 Z"/>
        </clipPath>
      </defs>
      <image href="slice1.png" width="360" height="360" clip-path="url(#clip1)"></image>
    </g>

    <!-- BOTTOM-RIGHT → Mars -->
    <g class="slice" data-target="bottomright">
      <defs>
        <clipPath id="clip2">
          <path d="M180 180 L340 180 A160 160 0 0 1 180 340 Z"/>
        </clipPath>
      </defs>
      <image href="slice2.png" width="360" height="360" clip-path="url(#clip2)"></image>
    </g>

    <!-- BOTTOM-LEFT → Venus -->
    <g class="slice" data-target="bottomleft">
      <defs>
        <clipPath id="clip3">
          <path d="M180 180 L180 340 A160 160 0 0 1 20 180 Z"/>
        </clipPath>
      </defs>
      <image href="slice3.png" width="360" height="360" clip-path="url(#clip3)"></image>
    </g>

    <!-- TOP-LEFT → Mercury -->
    <g class="slice" data-target="topleft">
      <defs>
        <clipPath id="clip4">
          <path d="M180 180 L20 180 A160 160 0 0 1 180 20 Z"/>
        </clipPath>
      </defs>
      <image href="slice4.png" width="360" height="360" clip-path="url(#clip4)"></image>
    </g>

  </svg>

</div>

<script>
// Hover show text
document.querySelectorAll(".slice").forEach(slice=>{
  slice.addEventListener("mouseenter",()=>{
    document.getElementById(slice.dataset.target).style.opacity = "1";
  });
  slice.addEventListener("mouseleave",()=>{
    document.getElementById(slice.dataset.target).style.opacity = "0";
  });
});
</script>

</body>
</html>
