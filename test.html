<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>4 Concepts Hover Infographic</title>
 
<style>
body{
  background:#f3f4f6;
  font-family: Arial, sans-serif;
}
 
/* MAIN CONTAINER */
.infographic{
  width:520px;
  height:520px;
  margin:50px auto;
  display:grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  position:relative;
}
 
/* COMMON PIECE STYLE */
.piece{
  position:relative;
  background-size:cover;
  background-position:center;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:transform 0.4s ease;
}
 
/* TEXT */
.item{
  position:relative;
  width:100%;
  height:100%;
}
 
 
.text{
  position:absolute;
  width:180px;
  font-size:20px;
}
 
/* LEFT SIDE TEXT */
.text.left{
  left:-190px;
  top:50%;
  transform:translateY(-50%);
  text-align:right;
}
 
/* RIGHT SIDE TEXT */
.text.right{
  right:-190px;
  top:50%;
  transform:translateY(-50%);
  text-align:left;
}
 
/* BOTTOM LEFT */
.text.bottom-left{
  left:-190px;
  bottom:20px;
  text-align:right;
}
 
/* BOTTOM RIGHT */
.text.bottom-right{
  right:-190px;
  bottom:20px;
  text-align:left;
}
 
 
.desc{
  opacity:0;
  transition:opacity 0.3s ease;
}
 
/* when hovering image, show text */
.item:hover .desc{
  opacity:1;
}
 
.desc{
  font-size:14px;
  opacity:0;
  transition:opacity 0.3s ease;
  text-align:center;
  padding:20px;
}
 
/* HOVER EFFECT */
.piece:hover .desc{
  opacity:1;
}
 
/* INDIVIDUAL PIECES + SEPARATION DIRECTION */
.jupiter:hover{ transform:translate(-15px,-15px); }
.mars:hover{ transform:translate(15px,-15px); }
.venus:hover{ transform:translate(-15px,15px); }
.mercury:hover{ transform:translate(15px,15px); }
 
/* COLORS / PLACEHOLDER IMAGES */
.jupiter{
  background-image:url("1.png");
  background-size:cover;
  background-position:center;
  border-top-left-radius:100%;
}
 
.mars{
  background-image:url("2.png");
  background-size:cover;
  background-position:center;
  border-top-right-radius:100%;
}
 
.venus{
  background-image:url("3.png");
  background-size:cover;
  background-position:center;
  border-bottom-left-radius:100%;
}
 
.mercury{
  background-image:url("4.png");
  background-size:cover;
  background-position:center;
  border-bottom-right-radius:100%;
}
 
 
.piece{
  width:100%;
  height:100%;
}  
 
/* TEXT COLORS */
.jupiter .title{ color:#0e6251; }
.mars .title{ color:#33691e; }
.venus .title{ color:#0d47a1; }
.mercury .title{ color:#4a148c; }
 
.title{
  font-weight:bold;}
 
</style>
</head>
 
<body>
 
<div class="infographic">
 
  <div class="item">
    <div class="piece jupiter"></div>
    <div class="text left">
      <div class="title">Jupiter</div>
      <div class="desc">Jupiter is the biggest planet in the Solar System</div>
    </div>
  </div>
 
  <div class="item">
    <div class="piece mars"></div>
    <div class="text right">
      <div class="title">Mars</div>
      <div class="desc">Despite being red, Mars is actually a cold place</div>
    </div>
  </div>
 
  <div class="item">
    <div class="piece venus"></div>
    <div class="text bottom-left">
      <div class="title">Venus</div>
      <div class="desc">Venus is terribly hot, even hotter than Mercury</div>
    </div>
  </div>
 
  <div class="item">
    <div class="piece mercury"></div>
    <div class="text bottom-right">
      <div class="title">Mercury</div>
      <div class="desc">Mercury is the closest planet to the Sun</div>
    </div>
  </div>
 
</div>
 
 
</body>
</html>
